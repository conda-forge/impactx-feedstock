schema_version: 1

context:
  name: impactx
  version: "26.09"
  build: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/BLAST-ImpactX/impactx/archive/${{ version }}.tar.gz
  sha256: 8dd1ba4ac87800c3e5860711dbfd715e3efbb4cccd5c1f8bcd47fce1dc886224
  patches:
    # SP test tolerances for the Strang split and the MAD-X solenoid promotion
    #   https://github.com/BLAST-ImpactX/impactx/pull/1654
    - 1654.patch

build:
  skip:
    - match(python, "<3.11")
  # prioritize DP builds if unspecified
  number: ${{ build | int + 100 if impactx_precision == "dp" else build }}
  string: nompi_${{ impactx_precision }}_h${{ hash }}_${{ build | int + 100 if impactx_precision == "dp" else build }}

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - pybind11
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    # Target the x86-64-v3 microarchitecture on Unix x86_64 (linux-64/osx-64).
    # Injects -march=x86-64-v3 and adds an __archspec run-export so the package
    # only installs on v3-capable CPUs. This activation package is __unix-only;
    # Windows sets the flag in build.bat and adds the __archspec guard in run.
    - if: unix
      then:
        - if: x86_64
          then: x86_64-microarch-level ==${{ microarch_level }}
        - make
    - if: win
      then:
        - clang
        - lld
        - llvm-openmp
        - ninja
    - if: linux
      then: libgomp
    - if: osx
      then: llvm-openmp
    - cmake
    - pkg-config

  host:
    - amrex ==${{ version }}[build=nompi_${{ impactx_precision }}_*]
    - fftw
    - if: win
      then:
        - libblas 3.9.* *netlib
    - numpy
    # ABLASTR 26.08 requires openPMD-api 0.17.0+
    #   find_package(openPMD 0.17.0 CONFIG REQUIRED ...)
    - openpmd-api >=0.17.0 [build=nompi_*]
    - pip
    - pyamrex ==${{ version }}[build=nompi_${{ impactx_precision }}_*]
    - pybind11
    - pybind11-abi
    - python
    - setuptools
    - vir-simd
    - wheel
    - zlib
  run:
    - if: win
      then:
        - libblas 3.9.* *netlib
    # see requirements.txt
    - pals-schema >=0.3.0,<0.4.0
    - pyamrex ==${{ version }}[build=nompi_${{ impactx_precision }}_*]
    - python
    - scipy
    - quantiphy
    # see src/python/impactx/dashboard/requirements.txt
    - pandas
    - plotly
    - trame
    - trame-matplotlib
    - trame-plotly
    - trame-router
    - trame-vuetify
    - trame-xterm
    # On Windows the x86_64-microarch-level activation package is unavailable
    # (__unix-only), so add the internal __archspec guard package directly. This
    # mirrors the run-export the Unix builds get and keeps the v3-built Windows
    # package from installing on pre-v3 CPUs. The -march flag is set in build.bat.
    - if: win
      then: _x86_64-microarch-level >=${{ microarch_level }}

  run_exports:
    # strict runtime dependency on build-time DP/SP variant
    - ${{ name }} * ${{ impactx_precision }}_*
    # releases are not (yet) compatible
    - impactx ==${{ version }}

tests:
  - python:
      imports:
        - impactx
      pip_check: false
  - package_contents:
      files:
        - if: unix and impactx_precision == "dp"
          then:
            - bin/impactx.NOMPI.OMP.DP.OPMD
        - if: unix and impactx_precision == "sp"
          then:
            - bin/impactx.NOMPI.OMP.SP.OPMD
        - if: win and impactx_precision == "dp"
          then:
            - Library/bin/impactx.NOMPI.OMP.DP.OPMD.exe
        - if: win and impactx_precision == "sp"
          then:
            - Library/bin/impactx.NOMPI.OMP.SP.OPMD.exe

  - script:
      - echo "Testing..."
      - if: unix and (build_platform == target_platform)
        then: ./test.sh
      - if: win
        then: call test.bat
    requirements:
      run:
        - python
        - pytest
        - pytest-benchmark
        - selenium
        # ctest, see examples/requirements.txt
        # TODO: PyNAFF
        - if: build_platform == target_platform
          then:
            - matplotlib
        - if: win
          then:
            - libblas 3.9.* *netlib
    files:
      recipe:
        - if: unix
          then: test.sh
        - if: win
          then: test.bat
      source:
        - examples/fodo/input_fodo.in
        - examples/fodo/run_fodo.py
        - tests/python/
        - examples/chicane/input_chicane_csr.in
        - examples/expanding_beam/input_expanding_fft_2D.in

about:
  license: BSD-3-Clause-LBNL
  license_file: LICENSE.txt
  summary: ImpactX enables high-performance modeling of beam dynamics in particle accelerators with collective effects.
  description: |
    ImpactX enables high-performance modeling of beam dynamics in particle accelerators with collective effects.

    This is the next generation of the IMPACT-Z code. ImpactX runs on modern
    GPUs or CPUs alike, provides user-friendly interfaces suitable for AI/ML
    workflows, has many benchmarks to ensure its correctness, and an extensive
    documentation.
  homepage: https://impactx.readthedocs.io
  repository: https://github.com/BLAST-ImpactX/impactx
  documentation: https://impactx.readthedocs.io

extra:
  recipe-maintainers:
    - ax3l
    - cemitch99
    - EZoni
    - RemiLehe
